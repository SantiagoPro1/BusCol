name: Captura Bronce

on:
  schedule:
    - cron: "0 13 * * *"   # diario 07:00 Colima (tipo de cambio diario; puertos solo baja informes nuevos)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y poppler-utils
      - run: python extractores/puertos.py --test
      - run: python extractores/tipo_cambio.py
      - run: python extractores/puertos.py
        if: always()   # una fuente caída no detiene a la otra
      - name: Guardar datos nuevos
        if: always()   # la bitácora se guarda aunque una captura falle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bronce
          git diff --cached --quiet || git commit -m "bronce: captura automática $(date -u +%F)"
          git push
